# =============================================================================
# CV data (rendercv format) — modeled on Seth Gossage's academic CV
#   Source: https://sgossage.github.io/cv/CV_sgossage2024.pdf
#
# HOW THE THEME RENDERS THIS (al_folio_cv 1.0.2):
#   Only these section NAMES get rich (dated, structured) rendering:
#     Experience (+ Volunteer, merged into "Experience" and floated to the top),
#     Education, Awards / "Honors and Awards", Publications, Skills, Languages,
#     Interests / "Academic Interests", Certificates, Projects, References.
#   ANY other section name renders "generic": only `bullet:` lines or
#     `label:`/`details:` pairs show up. That's why Talks, Teaching, and the two
#     publication lists below are written as `bullet:` items.
#   Sections render top-to-bottom in the order written here (except Experience,
#     which is always pulled to the top).
#
# TODO markers = fill in / verify your real details.
# =============================================================================

cv:
  name: Rebecca Woody
  label: Ph.D. Candidate, Astrophysics
  email: rebecca.woody@cfa.harvard.edu
  website: https://rebeccawoody.github.io/
  # phone: ""  # optional
  # image: ""  # optional
  # summary: >   # optional — Gossage's CV has none; uncomment to add a blurb.
  #   ...

  address:
    street: 60 Garden Street            # TODO: verify / change to your mailing address
    city: Cambridge
    region: MA
    postalCode: "02138"
    countryCode: US

  sections:
    # --- "Employment" on Gossage's CV → Experience (recognized, rich) ---------
    Experience:
      - company: Center for Astrophysics | Harvard & Smithsonian
        position: Graduate Researcher                 # TODO: verify title
        location: Cambridge, MA
        start_date: 2020                              # TODO: verify start year
        # end_date omitted → renders "Present"
        summary: ""                                   # optional one-line italic blurb
        highlights:
          - "TODO: research group / advisor and a one-line description."

    # --- Education (recognized, rich) -----------------------------------------
    Education:
      - institution: Harvard University               # TODO: verify (Harvard Griffin GSAS)
        area: Astronomy & Astrophysics
        studyType: Ph.D. (in progress)
        start_date: 2020                              # TODO: verify
        # end_date: 2026                              # TODO: expected year
        location: Cambridge, MA
        highlights:
          - "Advisor: TODO"

      - institution: TODO Undergraduate Institution   # TODO
        area: Physics / Astronomy                     # TODO
        studyType: B.S.                               # TODO
        start_date: 0000                              # TODO
        end_date: 0000                                # TODO
        location: TODO
        highlights:
          - "TODO: honors, e.g. Magna Cum Laude; advisor."

    # --- Research Interests (generic → single bullet paragraph) ---------------
    Research Interests:
      - bullet: >
          Galactic archaeology; the formation and hierarchical assembly of the
          Milky Way halo; globular cluster systems; stellar ages and isochrone
          fitting; the age–metallicity relation; accreted dwarf galaxies and the
          Gaia–Sausage–Enceladus merger; low-mass stars and the mixing-length
          parameter.

    # --- Teaching & Leadership (generic → bullets; org bolded per line) --------
    Teaching and Leadership:
      - bullet: "**TODO Institution** — Teaching Fellow (YEAR): led sections/office hours; assisted with assignment and exam design."
      - bullet: "**TODO Program** — Mentor (YEAR–YEAR): mentored undergraduate researchers; advised on grad-school applications."

    # --- Professional Activities (generic → bullets) ---------------------------
    Professional Activities:
      - bullet: "TODO: e.g. referee for a journal, review panel member, committee service."

    # --- "Awards & Honors" → Honors and Awards (recognized, rich) -------------
    #   `date` badge shows the first year only; put ranges in the title/summary.
    Honors and Awards:
      - title: "TODO Fellowship / Award"
        date: 0000
        summary: "TODO: short description (optional)."

    # --- Talks (generic → bullets) --------------------------------------------
    Talks:
      - bullet: "*TODO Conference / Seminar*, Location (Month Year)"

    # --- Posters (generic → bullets) ------------------------------------------
    Posters:
      - bullet: "*TODO Conference*, Location (Month Year)"

    # --- Workshops (generic → bullets) ----------------------------------------
    Workshops:
      - bullet: "*TODO Workshop / Summer School*, Location (Month Year)"

    # --- First-author publications (generic → bullets; title italic, name bold)
    #   The theme's rich "Publications" type only supports ONE section, so to keep
    #   Gossage's first- vs co-author split each citation is a formatted bullet.
    First-Author Publications:
      - bullet: >
          [*The Age–Metallicity–Specific Orbital Energy Relation for the Milky
          Way's Globular Cluster System Confirms the Importance of Accretion for
          Its Formation*](https://ui.adsabs.harvard.edu/abs/2021AJ....162...42W/abstract)<br>
          **Woody, R.**, Schlaufman, K. C. 2021, AJ, 162, 42
      - bullet: >
          [*The Rapid Formation of the Metal-poor Milky
          Way*](https://ui.adsabs.harvard.edu/abs/2025ApJ...978..152W)<br>
          **Woody, R.**, et al. 2025, ApJ, 978, 152
      - bullet: >
          *Classical Cases of Non-Solar Mixing Length in Low Mass Stars*<br>
          **Woody, R.**, et al., in preparation

    # --- Co-author publications (generic → bullets) ---------------------------
    Co-Author Publications:
