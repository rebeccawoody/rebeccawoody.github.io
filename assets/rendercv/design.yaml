# rendercv design for assets/pdf/woody_cv.pdf — tuned to match the classic
# black-on-white, serif (LaTeX Computer Modern) academic CV look.
# Passed to rendercv via `-d` (see build_pdf.sh). Docs:
# https://docs.rendercv.com/user_guide/yaml_input_structure/design/
design:
  theme: classic
  page:
    size: us-letter
    top_margin: 0.7in
    bottom_margin: 0.7in
    left_margin: 0.7in
    right_margin: 0.7in
    show_footer: false
    show_top_note: false
  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)
  typography:
    alignment: justified
    font_family:
      body: New Computer Modern
      name: New Computer Modern
      headline: New Computer Modern
      connections: New Computer Modern
      section_titles: New Computer Modern
    font_size:
      name: 24pt
  section_titles:
    type: with_full_line
    line_thickness: 1pt
  header:
    alignment: left
    connections:
      show_icons: false
      separator: "|"
  sections:
    show_time_spans_in: []
